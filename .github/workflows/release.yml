name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

      - name: Scrape Chinese documents
        run: python main.py scrape --force

      - name: Generate Chinese index
        run: python -c "from src.scraper.orchestrator import generate_index; generate_index()"

      - name: Scrape English documents
        run: python main.py --lang en-us scrape --force

      - name: Generate English index
        run: python -c "from src.core.config import set_language, Language; from src.scraper.orchestrator import generate_index; set_language(Language.EN_US); generate_index()"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import re
          from pathlib import Path
          content = Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Extract the section for the current version
          version = "${{ steps.changelog.outputs.version }}"
          pattern = rf"## \[{re.escape(version)}\].*?(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          if match:
            Path("release_notes.md").write_text(match.group(0).strip(), encoding="utf-8")
          else:
            Path("release_notes.md").write_text("No changelog entry found for this version.", encoding="utf-8")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            docs/**
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
